<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VA Tech Campus Map</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css">
</head>

<body>
  <header id="main-header">
    <div id="logo-left">
      <img src="/assets/hokie.png" alt="Hokie Bird Logo" id="hokie-bird">
    </div>

    <div id="header-center">
      <h1 id="title">Virginia Tech Campus Navigator</h1>
      <div id="weather">Loading weather...</div>
      <div id="authStatus">Public mode</div>
    </div>

    <div id="logo-right">
      <img src="/assets/jci.png" alt="JCI Logo" id="jci-logo">
    </div>
  </header>

  <!-- Login Modal -->
  <div id="loginModal">
    <div id="loginModalBox">
      <button id="modalClose">✕</button>
      <h2 id="modalTitle">Sign In</h2>

      <input id="modalEmail" type="email" placeholder="Email" autocomplete="email">
      <input id="modalPassword" type="password" placeholder="Password" autocomplete="current-password">
      <div id="modalError"></div>

      <button id="modalEmailBtn" class="modal-btn modal-btn-primary">Sign In with Email</button>
      <div class="modal-divider"><span>or</span></div>
      <button id="modalGoogleBtn" class="modal-btn modal-btn-google">Sign in with Google</button>
      <button id="modalToggleMode" class="modal-btn-link">No account? Create one</button>
    </div>
  </div>

  <main>
    <div id="map"></div>

    <div id="sidebar">
      <button id="loginButton" class="admin-button">Login</button>
      <button id="logoutButton" class="admin-button" style="display: none;">Logout</button>
      <button id="adminModeButton" class="admin-mode-button" style="display: none;">⚪ Admin Mode OFF</button>
      <a id="adminPanelLink" href="/admin.html" class="admin-panel-link" style="display: none;">👥 Manage Users</a>
      <button id="routeButton" class="route-button" style="display: none;">Route Me There</button>
      <button id="voiceSearch">🎤</button>
      <ul id="buildingList"></ul>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <script src="/js/config/firebase-config.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/services/authService.js"></script>
  <script src="/js/services/buildingService.js"></script>
  <script src="/js/services/weatherService.js"></script>
  <script src="/js/services/routingService.js"></script>
  <script src="/js/ui/buildingList.js"></script>
  <script src="/js/ui/buildingPopup.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
